x-app: &app
  build:
    context: .
  image: clinic-app:local
  env_file: .env
  environment: &app-environment
    DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    SMTP_ADDRESS: mailpit
    CLAMAV_HOST: clamav
  volumes:
    - app_storage:/rails/storage

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  prepare:
    <<: *app
    command: ["./bin/rails", "db:prepare"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    environment:
      <<: *app-environment
      SKIP_DB_PREPARE: "true"
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]
    depends_on:
      prepare:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      clamav:
        condition: service_started
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  worker:
    <<: *app
    command: ["./bin/jobs", "start"]
    depends_on:
      prepare:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      clamav:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
  clamav_data:
